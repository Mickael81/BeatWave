name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Default Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Single Universal Release APK
        run: |
          set -o pipefail
          ./gradlew assembleUniversalGmsRelease --stacktrace --no-daemon 2>&1 | tee build.log
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload Build Failure Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: build.log

      - name: Dump Failure Log to Step Summary
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "### Gradle Build Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 250 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatWave-v4.4.0-latest
          path: app/build/outputs/apk/universalGms/release/*.apk